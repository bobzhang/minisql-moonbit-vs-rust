name: MoonBit CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
        module: ["implementations/moonbit-t1", "implementations/moonbit-t2", "implementations/moonbit-t3"]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- ${{ matrix.toolchain }}
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check
      # T3 retains exported `alias` fields pending the API decision in issue #2.
      - name: Strict warning check for T1 and T2
        if: matrix.module != 'implementations/moonbit-t3'
        run: moon check --deny-warn
      - run: moon fmt --check
      - run: moon test
      - run: moon build --release
